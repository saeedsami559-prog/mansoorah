<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mansoorah</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA fallback: remember the deep link and load the app shell.
      (function () {
        var base = '/mansoorah/';
        try {
          sessionStorage.setItem('mansoorah.redirect', location.pathname + location.search + location.hash);
        } catch (e) {}
        location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
