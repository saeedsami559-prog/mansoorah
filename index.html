    <script>
      // Apply theme and language before first paint to avoid a flash.
      (function () {
        try {
          var d = document.documentElement;
          var th = localStorage.getItem('mansoorah.v1.theme');
          if (th === 'dark') d.dataset.theme = 'dark';
          var q = new URLSearchParams(location.search).get('lang');
          var l = q || localStorage.getItem('mansoorah.v1.lang') || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
          if (l === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
        } catch (e) {}
      })();
